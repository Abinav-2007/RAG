[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.5",
    "langchain-openai>=1.3.0",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.1",
    "markdown>=3.10.3",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers",
    "torch",
    "unstructured>=0.23.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
